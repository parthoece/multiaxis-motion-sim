[EMC]
MACHINE = Virtual XYZ Commissioning Profile
DEBUG = 0
VERSION = 1.1

[DISPLAY]
DISPLAY = axis
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.5
PROGRAM_PREFIX = ../../../gcode/xyz-3axis
INCREMENTS = 10mm 1mm 0.1mm 0.01mm

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HAL]
HALFILE = machine.hal
POSTGUI_HALFILE = postgui.hal

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 20.0
MAX_LINEAR_VELOCITY = 100.0
NO_FORCE_HOMING = 0

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[AXIS_X]
MIN_LIMIT = 0.0
MAX_LIMIT = 500.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 300.0

[AXIS_Y]
MIN_LIMIT = 0.0
MAX_LIMIT = 400.0
MAX_VELOCITY = 80.0
MAX_ACCELERATION = 250.0

[AXIS_Z]
MIN_LIMIT = 0.0
MAX_LIMIT = 150.0
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 100.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_SEQUENCE = 1
MIN_LIMIT = 0.0
MAX_LIMIT = 500.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 300.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_SEQUENCE = 2
MIN_LIMIT = 0.0
MAX_LIMIT = 400.0
MAX_VELOCITY = 80.0
MAX_ACCELERATION = 250.0

[JOINT_2]
TYPE = LINEAR
HOME = 150.0
HOME_OFFSET = 150.0
HOME_SEARCH_VEL = 0.0
HOME_LATCH_VEL = 0.0
HOME_SEQUENCE = 0
MIN_LIMIT = 0.0
MAX_LIMIT = 150.0
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 100.0
