<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Virtual XYZ motion-control platform overview</title>
  <desc id="desc">A system overview showing the operator interface, machine workflows, deterministic and grblHAL motion backends, virtual process signals, persistence, diagnostics, fault injection, and deliberate recovery.</desc>
  <rect width="1200" height="650" rx="28" fill="#f6f8fa"/>
  <text x="60" y="72" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">Virtual commissioning before physical hardware</text>
  <text x="60" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#4b5568">Deterministic XYZ inspection, abnormal-condition testing, evidence, and recovery</text>

  <rect x="55" y="155" width="245" height="170" rx="18" fill="#ffffff" stroke="#76839a" stroke-width="2"/>
  <text x="178" y="196" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#172033">Operator</text>
  <rect x="86" y="222" width="182" height="42" rx="9" fill="#e9eef8"/>
  <text x="177" y="249" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#172033">WPF HMI</text>
  <rect x="86" y="274" width="182" height="32" rx="8" fill="#eef2f7"/>
  <text x="177" y="296" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#4b5568">Console scenarios</text>

  <rect x="365" y="138" width="370" height="205" rx="18" fill="#ffffff" stroke="#526b94" stroke-width="3"/>
  <text x="550" y="180" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#172033">Machine workflows</text>
  <text x="550" y="215" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#344056">Initialize · Home · Inspect · Stop</text>
  <text x="550" y="247" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#344056">State rules · Command gate · Fault context</text>
  <rect x="405" y="275" width="290" height="42" rx="9" fill="#e9eef8"/>
  <text x="550" y="302" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#172033">MachineCoordinator + focused services</text>

  <rect x="800" y="138" width="345" height="205" rx="18" fill="#ffffff" stroke="#76839a" stroke-width="2"/>
  <text x="972" y="180" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#172033">Replaceable boundaries</text>
  <rect x="830" y="210" width="135" height="48" rx="9" fill="#e9eef8"/>
  <text x="898" y="240" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#172033">Deterministic</text>
  <rect x="980" y="210" width="135" height="48" rx="9" fill="#e9eef8"/>
  <text x="1048" y="240" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#172033">grblHAL TCP</text>
  <rect x="830" y="274" width="135" height="42" rx="9" fill="#eef2f7"/>
  <text x="898" y="301" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#4b5568">Virtual PLC</text>
  <rect x="980" y="274" width="135" height="42" rx="9" fill="#eef2f7"/>
  <text x="1048" y="301" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#4b5568">Future adapters</text>

  <line x1="300" y1="240" x2="365" y2="240" stroke="#526b94" stroke-width="4"/>
  <polygon points="365,240 351,232 351,248" fill="#526b94"/>
  <line x1="735" y1="240" x2="800" y2="240" stroke="#526b94" stroke-width="4"/>
  <polygon points="800,240 786,232 786,248" fill="#526b94"/>

  <rect x="55" y="405" width="1090" height="170" rx="18" fill="#ffffff" stroke="#9aa5b5" stroke-width="2"/>
  <text x="90" y="449" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#172033">Repeatable evidence path</text>

  <rect x="90" y="478" width="175" height="56" rx="10" fill="#eef2f7"/>
  <text x="178" y="501" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#172033">Inject condition</text>
  <text x="178" y="522" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#4b5568">probe · PLC · E-stop</text>

  <rect x="305" y="478" width="175" height="56" rx="10" fill="#eef2f7"/>
  <text x="393" y="501" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#172033">Run workflow</text>
  <text x="393" y="522" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#4b5568">move · probe · cancel</text>

  <rect x="520" y="478" width="175" height="56" rx="10" fill="#eef2f7"/>
  <text x="608" y="501" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#172033">Preserve fault</text>
  <text x="608" y="522" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#4b5568">primary alarm first</text>

  <rect x="735" y="478" width="175" height="56" rx="10" fill="#eef2f7"/>
  <text x="823" y="501" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#172033">Record evidence</text>
  <text x="823" y="522" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#4b5568">SQLite · JSON Lines</text>

  <rect x="950" y="478" width="160" height="56" rx="10" fill="#e9eef8"/>
  <text x="1030" y="501" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#172033">Recover</text>
  <text x="1030" y="522" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#4b5568">Ready · NotHomed · Off</text>

  <g fill="#526b94">
    <polygon points="296,506 282,498 282,514"/>
    <polygon points="511,506 497,498 497,514"/>
    <polygon points="726,506 712,498 712,514"/>
    <polygon points="941,506 927,498 927,514"/>
