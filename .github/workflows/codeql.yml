name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended

      - run: dotnet restore
      - run: dotnet build multiaxis-motion-sim.sln --configuration Release --no-restore

      - uses: github/codeql-action/analyze@v4
